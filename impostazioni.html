<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexyTalk - Impostazioni</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .settings-card {
            background: #ffffff;
            width: 100%;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        .settings-card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #1c1e21;
            border-bottom: 1px solid #e4e6eb;
            padding-bottom: 8px;
        }
        .btn-save {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save:hover { background-color: #166fe5; }
        .alert-msg { margin-top: 10px; font-weight: 600; font-size: 14px; }
        
        /* Stili per la foto profilo */
        .avatar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .avatar-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-preview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #e4e6eb;
            object-fit: cover;
            border: 2px solid #1877f2;
        }
        .avatar-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-action {
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ccd0d5;
            background-color: #f0f2f5;
            color: #050505;
            transition: 0.2s;
            text-align: center;
        }
        .btn-action:hover { background-color: #e4e6eb; }
        .btn-delete {
            background-color: #ffebe9;
            color: #ee2a24;
            border-color: rgba(238, 42, 36, 0.2);
        }
        .btn-delete:hover { background-color: #ffd8d6; }
    </style>
</head>
<body>

    <!-- Barra Superiore Bianca -->
    <div class="nav-bar">
        <div class="nav-logo" onclick="window.location.href='home.html'" style="cursor:pointer;">Wordly</div>
        <div id="welcomeTitle">⚙️ Impostazioni Account</div>
        <button class="logout-btn" onclick="logout()">Esci</button>
    </div>

    <!-- Layout Principale -->
    <div class="main-layout">
        
        <!-- Menu Laterale Sinistro -->
        <div class="sidebar-left">
            <div class="sidebar-item" onclick="window.location.href='home.html'" style="cursor: pointer;">🏠 Feed dei post</div>
            <div class="sidebar-item" onclick="window.location.href='amici.html'" style="cursor: pointer;">👥 Amici</div>
            <div class="sidebar-item" onclick="window.location.href='messaggi.html'" style="cursor: pointer;">💬 Messaggi</div>
            <div class="sidebar-item" onclick="window.location.href='eventi.html'" style="cursor: pointer;">📅 Eventi</div>
            <div class="sidebar-item" onclick="window.location.href='impostazioni.html'" style="background-color: #e4e6eb; font-weight: bold; cursor: pointer;">⚙️ Impostazioni</div>
        </div>

        <!-- Contenuto Centrale -->
        <div class="feed-container">
            
            <!-- Modifica Profilo -->
            <div class="settings-card">
                <h2>Modifica Profilo</h2>
                
                <!-- SEZIONE FOTO PROFILO AVVOLTA DA FORM DI CODIFICA FILE -->
                <form id="avatarForm" enctype="multipart/form-data">
                    <div class="avatar-section">
                        <label style="font-size: 14px; font-weight: 700; color: #65676b;">FOTO PROFILO</label>
                        <div class="avatar-container">
                            <!-- Icona iniziale pulita incorporata -->
                            <img id="avatarPreview" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%231877f2'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Avatar">
                            
                            <div class="avatar-buttons">
                                <!-- Tasto per scegliere il file -->
                                <label class="btn-action" style="display: inline-block;">
                                    📁 Scegli foto...
                                    <input type="file" id="avatarFileInput" name="avatar" accept="image/*" style="display: none;">
                                </label>
                                
                                <!-- Tasto Salva Foto Dedicato -->
                                <button type="submit" class="btn-action" style="background-color: #1877f2; color: white; border: none;">💾 Salva Foto</button>
                                
                                <!-- Tasto Rimuovi Foto -->
                                <button type="button" class="btn-action btn-delete" id="btnResetAvatar">🗑️ Rimuovi</button>
                            </div>
                        </div>
                        <div id="fotoMsg" class="alert-msg"></div>
                    </div>
                </form>

                <!-- Modifica Dati Personali -->
                <div style="border-top: 1px solid #e4e6eb; padding-top: 20px; margin-top: 20px;">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label>Nome Utente</label>
                        <input type="text" id="usernameInput" placeholder="Nuovo nome utente">
                    </div>
                    <button class="btn-save" onclick="salvaProfilo()">Aggiorna Nome</button>
                    <div id="profiloMsg" class="alert-msg"></div>
                </div>
            </div>

            <!-- Sicurezza -->
            <div class="settings-card">
                <h2>Sicurezza</h2>
                <div class="input-group">
                    <label>Nuova Password</label>
                    <input type="password" id="passwordInput" placeholder="Inserisci la nuova password">
                </div>
                <button class="btn-save" onclick="salvaPassword()">Cambia Password</button>
                <div id="passwordMsg" class="alert-msg"></div>
            </div>

        </div>
    </div>

    <script>
        const userData = JSON.parse(localStorage.getItem('user'));
        const MIO_ID = userData ? userData.id : null;

        if (!MIO_ID) {
            window.location.href = 'login.html';
        }

        if (userData && userData.username) {
            document.getElementById('usernameInput').value = userData.username;
        }

        const fileInput = document.getElementById('avatarFileInput');
        const imgPreview = document.getElementById('avatarPreview');
        const msgDiv = document.getElementById('fotoMsg');

        // 🖼️ GESTORE ANTEPRIMA UNIVERSALE (CORRETTO!)
        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.addEventListener('load', function(e) {
                    imgPreview.setAttribute('src', e.target.result);
                });
                reader.readAsDataURL(fileInput.files[0]);
                msgDiv.textContent = ''; 
            }
        });

        // 💾 FUNZIONE DI SALVATAGGIO (CORRETTA!)
        document.getElementById('avatarForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!fileInput.files || fileInput.files.length === 0) {
                msgDiv.style.color = '#dc3545';
                msgDiv.textContent = '❌ Seleziona prima una foto con il tasto "Scegli foto...".';
                return;
            }

            const formData = new FormData();
            formData.append('userId', MIO_ID);
            formData.append('avatar', fileInput.files[0]); 

            try {
                msgDiv.style.color = '#1877f2';
                msgDiv.textContent = '⏳ Caricamento della foto in corso...';

                const response = await fetch('/api/settings/avatar', {
                    method: 'PUT',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = '#28a745';
                    msgDiv.textContent = '✅ Foto profilo salvata con successo!';
                } else {
                    msgDiv.style.color = '#dc3545';
                    msgDiv.textContent = data.error || 'Errore durante il salvataggio.';
                }
            } catch (err) {
                msgDiv.style.color = '#dc3545';
                msgDiv.textContent = '❌ Errore durante il caricamento.';
            }
        });

        // Resetta l'anteprima visiva
        document.getElementById('btnResetAvatar').addEventListener('click', function() {
            imgPreview.setAttribute('src', "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%231877f2'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>");
            fileInput.value = "";
            msgDiv.style.color = 'orange';
            msgDiv.textContent = 'Anteprima resettata.';
        });

        // Aggiorna lo username
        async function salvaProfilo() {

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexyTalk - Messaggi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { flex-direction: column; height: auto; padding: 20px; justify-content: flex-start; }
        .main-layout { display: flex; justify-content: center; margin-top: 76px; padding: 0 32px; width: 100%; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .chat-layout { display: flex; background: white; width: 100%; height: 550px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); overflow: hidden; }
        .users-sidebar { width: 30%; border-right: 1px solid #e4e6eb; overflow-y: auto; padding: 10px; }
        .chat-area { width: 70%; display: flex; flex-direction: column; background: #f0f2f5; }
        .user-item { padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 5px; }
        .user-item:hover, .user-item.active { background-color: #e4e6eb; color: #1877f2; }
        .messages-box { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .message-bubble { max-width: 60%; padding: 10px 14px; border-radius: 18px; margin-bottom: 8px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .message-bubble.sent { background-color: #1877f2; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-bubble.received { background-color: white; color: black; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .chat-input-form { padding: 15px; background: white; display: flex; border-top: 1px solid #e4e6eb; }
        .chat-input { flex-grow: 1; padding: 10px 15px; border: none; background: #f0f2f5; border-radius: 20px; outline: none; font-size: 15px; margin-right: 10px; }
        .send-btn { width: auto !important; padding: 0 20px !important; }
    </style>
</head>
<body>

    <!-- Barra in alto -->
    <div class="nav-bar">
        <div class="nav-logo" onclick="window.location.href='home.html'" style="cursor:pointer;">TalkSpace</div>
        <span id="welcomeTitle">Caricamento...</span>
        <button class="logout-btn" onclick="logout()">Esci</button>
    </div>

    <!-- Contenuto principale -->
    <div class="main-layout">
        
        <!-- Menu di sinistra -->
        <div class="sidebar-left" style="left: calc(50% - 630px);">
            <div class="sidebar-item" onclick="window.location.href='home.html'" style="cursor: pointer;">🏠 Feed dei post</div>
            <div class="sidebar-item" onclick="window.location.href='amici.html'" style="cursor: pointer;">👥 Amici</div>
            <div class="sidebar-item" style="color: #1877f2; font-weight: bold; cursor: pointer;" onclick="window.location.href='messaggi.html'">💬 Messaggi</div>
            <div class="sidebar-item" onclick="window.location.href='eventi.html'" style="cursor: pointer;">📅 Eventi</div>
            <div class="sidebar-item" onclick="window.location.href='impostazioni.html'" style="cursor: pointer;">⚙️ Impostazioni</div>
        </div>

        <!-- Box di Chat Sdoppiato -->
        <div class="chat-layout">
            <!-- Elenco Persone a Sinistar -->
            <div class="users-sidebar" id="chatUsersList">
                <p style="color: #65676b; font-size: 14px; margin-bottom: 10px; padding-left: 5px;">Seleziona una chat:</p>
                <!-- Gli utenti compariranno qui -->
            </div>

            <!-- Finestra Conversazione a Destra -->
            <div class="chat-area">
                <div class="messages-box" id="messagesBox">
                    <p style="color: #65676b; text-align: center; margin: auto;">Scegli un amico dalla lista a sinistra per iniziare a chattare!</p>
                </div>
                <form class="chat-input-form" id="chatForm" style="display: none;">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Scrivi un messaggio privato..." required autocomplete="off">
                    <button type="submit" class="send-btn">Invia</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Carica la libreria di Socket.io direttamente dal server -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const loggedInUser = JSON.parse(localStorage.getItem('user'));
        if (!loggedInUser) { window.location.href = 'login.html'; }
        else { document.getElementById('welcomeTitle').innerText = `👋 ${loggedInUser.username}`; }

        // Inizializza la connessione in tempo reale
        const socket = io();
        let activeReceiverId = null;

        // Avvisa il server che siamo online
        socket.emit('utente_connesso', loggedInUser.id);

        // 1. Carica la lista degli utenti a sinistra
        async function caricaUtentiChat() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                const listEl = document.getElementById('chatUsersList');

                users.forEach(user => {
                    if (user.username !== loggedInUser.username) {
                        const item = document.createElement('div');
                        item.className = 'user-item';
                        item.innerText = `@${user.username}`;
                        // Mongoose usa sia _id che id, li verifichiamo per sicurezza
                        const idUtente = user._id || user.id;
                        item.onclick = () => apriChat(idUtente, item);
                        listEl.appendChild(item);
                    }
                });
            } catch (err) { console.error(err); }
        }

        // 2. Apri la conversazione con l'utente selezionato
        async function apriChat(receiverId, elementoScelto) {
            activeReceiverId = receiverId;
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            elementoScelto.classList.add('active');
            document.getElementById('chatForm').style.display = 'flex';
            caricaMessaggi();
        }

        // 3. Recupera i messaggi dal database
        async function caricaMessaggi() {
            if (!activeReceiverId) return;
            try {
                const response = await fetch(`/api/messages/${loggedInUser.id}/${activeReceiverId}`);
                const messages = await response.json();
                const box = document.getElementById('messagesBox');
                box.innerHTML = '';

                if(messages.length === 0) {
                    box.innerHTML = `<p style="color: #65676b; text-align: center; margin: auto;">Nessun messaggio precedente. Scrivi qualcosa per iniziare!</p>`;
                } else {
                    messages.forEach(msg => {
                        stampaBollaInChat(msg.sender, msg.content);
                    });
                }
                box.scrollTop = box.scrollHeight; 
            } catch (err) { console.error(err); }
        }

        // Funzione grafica per aggiungere una bolla di testo
        function stampaBollaInChat(senderId, testo) {
            const box = document.getElementById('messagesBox');
            
            // Rimuove la scritta di testo vuoto se presente prima di stampare
            if (box.querySelector('p')) {
                box.innerHTML = '';
            }

            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${senderId === loggedInUser.id ? 'sent' : 'received'}`;
            bubble.innerText = testo;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        // 4. Invia un nuovo messaggio (Tempo Reale)
        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !activeReceiverId) return;

            // Invia i dati tramite WebSocket
            socket.emit('invia_messaggio', {
                sender: loggedInUser.id,
                receiver: activeReceiverId,
                content: content
            });

            input.value = '';
        });

        // 5. Ascolta la conferma del messaggio inviato da te per mostrarlo
        socket.on('messaggio_inviato', (nuovoMsg) => {
            if (nuovoMsg.receiver === activeReceiverId) {
                stampaBollaInChat(nuovoMsg.sender, nuovoMsg.content);
            }
        });

        // 6. Ascolta i messaggi in arrivo in tempo reale da altri utenti
        socket.on('ricevi_messaggio', (nuovoMsg) => {
            if (nuovoMsg.sender === activeReceiverId) {
                stampaBollaInChat(nuovoMsg.sender, nuovoMsg.content);
            }
        });

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        caricaUtentiChat();
    </script>
</body>
</html>

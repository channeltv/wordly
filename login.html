<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexyTalk - Accedi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; background-color: #f0f2f5; overflow: hidden; }
        .split-left { width: 45%; background: linear-gradient(135deg, #1877f2 0%, #0056b3 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 40px; }
        .brand-title { font-size: 48px; font-weight: 800; margin-bottom: 10px; }
        .brand-subtitle { font-size: 18px; text-align: center; max-width: 320px; opacity: 0.9; }
        .split-right { width: 55%; background: #ffffff; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        .form-header { margin-bottom: 32px; }
        .form-header h2 { font-size: 28px; color: #1c1e21; margin-bottom: 8px; font-weight: 700; }
        .form-header p { color: #65676b; font-size: 15px; }
        .input-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #65676b; }
        .input-group input { padding: 14px 16px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 15px; outline: none; background-color: #f9f9f9; width: 100%; }
        button[type="button"] { background-color: #1877f2; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        button[type="button"]:hover { background-color: #166fe5; }
        #message { margin-top: 15px; font-size: 14px; font-weight: 600; text-align: center; }
        .footer-link { margin-top: 24px; text-align: center; color: #65676b; font-size: 14px; }
        .footer-link a { color: #1877f2; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <div class="split-left">
        <div class="brand-title">💬 NexyTalk</div>
        <div class="brand-subtitle">Connettiti con i tuoi amici, scambia messaggi e organizza eventi in libertà.</div>
    </div>

    <div class="split-right">
        <div class="form-header">
            <h2>Bentornato!</h2>
            <p>Inserisci le tue credenziali per accedere alla community.</p>
        </div>
        
        <form id="myForm">
            <div class="input-group">
                <label>Indirizzo Email o Username</label>
                <input type="text" id="myEmail" required placeholder="esempio@email.com o username">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="myPassword" required placeholder="••••••••">
            </div>
            
            <button type="button" onclick="inviaLogin()">Accedi all'Account</button>
        </form>
        
        <div id="message"></div>
        <p class="footer-link">Non hai ancora un account? <a href="index.html">Registrati adesso</a></p>
    </div>

    <script>
        async function inviaLogin() {
            const email = document.getElementById('myEmail').value;
            const password = document.getElementById('myPassword').value;
            const msg = document.getElementById('message');

            if(!email || !password) {
                msg.style.color = '#dc3545';
                msg.innerText = 'Inserisci tutti i campi.';
                return;
            }

            msg.style.color = '#1877f2';
            msg.innerText = 'Verifica credenziali in corso...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, username: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    msg.style.color = '#28a745';
                    msg.innerText = 'Accesso eseguito! Entrando nella chat...';
                    localStorage.setItem('utenteNexyTalk', JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1200);
                } else {
                    msg.style.color = '#dc3545';
                    msg.innerText = data.error || 'Credenziali errate.';
                }
            } catch (error) {
                msg.style.color = '#dc3545';
                msg.innerText = 'Errore di connessione al database.';
            }
        }
    </script>
</body>
</html>
